apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: srw
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: srw
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data"]
          ports: [{containerPort: 9000}]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: srw-secrets, key: MINIO_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: srw-secrets, key: MINIO_SECRET_KEY}}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
