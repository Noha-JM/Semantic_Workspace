apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: srw
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: srw
spec:
  template:
    spec:
      containers:
        - name: neo4j
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: srw
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minio
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: srw
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
