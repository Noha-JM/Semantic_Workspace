apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: srw
spec:
  replicas: 0
  template:
    spec:
      terminationGracePeriodSeconds: 1900
      nodeSelector:
        workload: worker
      tolerations:
        - key: workload
          operator: Equal
          value: worker
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker
