apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: srw
  namespace: srw
spec:
  ingressClassName: nginx
  rules:
    - host: research.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
