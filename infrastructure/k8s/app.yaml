apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: srw
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: srw
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: semantic-workspace-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: srw-config}
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: srw-secrets, key: POSTGRES_PASSWORD}}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: srw-secrets, key: MINIO_ACCESS_KEY}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: srw-secrets, key: MINIO_SECRET_KEY}}}
            - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: srw-secrets, key: NEO4J_PASSWORD}}}
            - {name: OPENALEX_API_KEY, valueFrom: {secretKeyRef: {name: srw-openalex, key: OPENALEX_API_KEY, optional: true}}}
            - {name: CORE_API_KEY, valueFrom: {secretKeyRef: {name: srw-secrets, key: CORE_API_KEY, optional: true}}}
            - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: srw-secrets, key: OPENAI_API_KEY, optional: true}}}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: srw
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: semantic-workspace-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker.worker"]
          envFrom:
            - configMapRef: {name: srw-config}
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: srw-secrets, key: POSTGRES_PASSWORD}}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: srw-secrets, key: MINIO_ACCESS_KEY}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: srw-secrets, key: MINIO_SECRET_KEY}}}
            - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: srw-secrets, key: NEO4J_PASSWORD}}}
            - {name: OPENALEX_API_KEY, valueFrom: {secretKeyRef: {name: srw-openalex, key: OPENALEX_API_KEY, optional: true}}}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: srw
spec:
  selector: {app: frontend}
  ports:
    - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: srw
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: semantic-workspace-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
