apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: srw
spec:
  selector: {app: neo4j}
  ports:
    - {name: bolt, port: 7687, targetPort: 7687}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: srw
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels: {app: neo4j}
  template:
    metadata:
      labels: {app: neo4j}
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports: [{containerPort: 7687}, {containerPort: 7474}]
          env:
            - name: NEO4J_AUTH
              valueFrom: {secretKeyRef: {name: srw-secrets, key: NEO4J_AUTH}}
            - name: NEO4J_server_memory_heap_max__size
              value: 1G
            - name: NEO4J_server_memory_pagecache_size
              value: 512M
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            tcpSocket: {port: 7687}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 2Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
