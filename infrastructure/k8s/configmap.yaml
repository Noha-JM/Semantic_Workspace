apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-config
  namespace: srw
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: semantic_workspace
  POSTGRES_USER: postgres
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_HOST: minio
  MINIO_PORT: "9000"
  MINIO_BUCKET: papers
  EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  EMBEDDING_DIM: "384"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  LLM_PROVIDER: none
  LLM_MODEL: gpt-4o-mini
  INGESTION_MAX_RETRIES: "3"
  CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,https://research.example.com
  MINIO_SECURE: "false"
